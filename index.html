<!doctype html>
<html lang="de" class="dark" data-palette="TRACKSIDE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C1 Deutsch</title>
    <meta
      name="description"
      content="Offline-first German practice with authored C1 scenarios, locally saved learning evidence, adaptive review suggestions, and synthetic text-to-speech."
    />
    <meta property="og:title" content="C1 Deutsch" />
    <meta
      property="og:description"
      content="Offline-first German practice with authored C1 scenarios, locally saved learning evidence, adaptive review suggestions, and synthetic text-to-speech."
    />
    <link rel="icon" type="image/jpeg" href="/images/img_app_icon.jpg" />
    <script>
      (function () {
        try {
          var isDark = localStorage.getItem('c1_is_dark');
          if (isDark === 'false') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
          var palette = localStorage.getItem('c1_palette');
          if (palette === 'SILVER' || palette === 'PITCH' || palette === 'TRACKSIDE') {
            document.documentElement.setAttribute('data-palette', palette);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
